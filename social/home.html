<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHIBA Social | Home</title>

    <meta name="theme-color" content="#0e0b16">

    <link rel="icon" type="image/svg+xml" href="assets/social-badge.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

    <link rel="stylesheet" href="css/social.css">
</head>

<body>

    <!-- topbar -->

    <header class="topbar">

        <a class="brand" href="home.html">

            <span class="glyph">◈</span>

            <span class="word"><b>SHIBA</b> <span>Social</span></span>

        </a>

        <div class="actions">

            <button class="iconBtn" id="newPostBtn" title="New post" aria-label="New post">

                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" d="M12 5v14M5 12h14"/>
                </svg>

            </button>

            <button class="avatarBtn" id="avatarBtn" title="You" aria-label="Your menu">

                <span id="avatarInitial">·</span>

            </button>

        </div>

    </header>

    <!-- profile dropdown -->

    <div class="menu hidden" id="userMenu">

        <div class="who">

            <div class="n" id="menuName">—</div>

            <div class="h" id="menuHandle">—</div>

        </div>

        <a href="profile.html">Your profile</a>

        <button class="danger" id="logoutBtn">Log out</button>

    </div>

    <!-- page -->

    <main class="page">

        <!-- composer teaser -->

        <button class="composer" id="composerTeaser">

            <span class="cAvatar" id="teaserAvatar"><span id="teaserInitial">·</span></span>

            <span class="cText">Share a photo…</span>

            <span class="cGo">Post</span>

        </button>

        <div class="sectionLabel">Community feed</div>

        <!-- feed -->

        <div id="feed"></div>

        <!-- loading / empty states -->

        <div class="card" id="feedLoading">

            <div class="empty"><p>Loading the feed…</p></div>

        </div>

        <div class="card hidden" id="feedEmpty">

            <div class="empty">

                <div class="emptyArt">

                    <svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">
                        <rect x="6" y="9" width="36" height="30" rx="4"
                              fill="none" stroke="currentColor" stroke-width="2.2"/>
                        <circle cx="17" cy="20" r="3.4"
                              fill="none" stroke="currentColor" stroke-width="2.2"/>
                        <path d="M9 35l10-9 7 6 6-5 7 6" fill="none"
                              stroke="currentColor" stroke-width="2.2"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>

                </div>

                <h3>No posts yet</h3>

                <p>Be the first to share something with the community.</p>

                <div style="margin-top:18px">

                    <button class="btn" id="emptyPostBtn"
                            style="display:inline-block;width:auto;padding:12px 22px">
                        Share a photo</button>

                </div>

            </div>

        </div>

    </main>

    <!-- ===================================================== -->
    <!-- Compose modal                                          -->
    <!-- ===================================================== -->

    <div class="mBack hidden" id="composeModal">

        <div class="mCard">

            <div class="mHead">

                <span>New post</span>

                <button class="mClose" id="composeClose" aria-label="Close">

                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2"
                              stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
                    </svg>

                </button>

            </div>

            <div class="mBody">

                <button class="pickArea" id="pickArea" type="button">

                    <div class="pickPrompt" id="pickPrompt">

                        <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
                            <rect x="6" y="9" width="36" height="30" rx="4"
                                  fill="none" stroke="currentColor" stroke-width="2.2"/>
                            <path d="M24 17v12M18 23h12" fill="none"
                                  stroke="currentColor" stroke-width="2.2"
                                  stroke-linecap="round"/>
                        </svg>

                        <span>Tap to choose a photo</span>

                    </div>

                    <img id="composePreview" class="hidden" alt="Preview">

                </button>

                <input type="file" id="postFile" accept="image/*" class="hidden">

                <div class="field" style="margin-top:16px">

                    <label for="postTitle">Title</label>

                    <input id="postTitle" type="text" maxlength="80"
                           placeholder="Name this photo… (optional)">

                </div>

                <div class="field">

                    <label for="postCaption">Caption</label>

                    <textarea id="postCaption" maxlength="600"
                              placeholder="Say something about it… (optional)"></textarea>

                </div>

            </div>

            <div class="mFoot">

                <button class="btn ghost" id="composeCancel">Cancel</button>

                <button class="btn" id="postBtn">Post</button>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/socialClient.js"></script>
    <script src="js/postCard.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
