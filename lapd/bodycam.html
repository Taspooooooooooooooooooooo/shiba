<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIBA PIMS | Bodycam</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div id="layoutTop"></div>

<div class="content">

    <div class="card">

        <h1><svg class="pIcon" width="24" height="24" aria-hidden="true"><use href="assets/pims-sprite.svg#pims-surveillance"></use></svg> Bodycam</h1>

        <p>Your bodycam — the current recording, storage and integrity of
           every clip. Start and stop recording from your duty widget on the
           Dashboard or your Shift File.</p>

    </div>

    <div class="card" id="bcDashCurrent">
        <p class="muted">Loading…</p>
    </div>

    <div class="card">
        <h2>Your recording sessions</h2>
        <div class="evrStats" id="bcDashStats"></div>
        <div id="bcDashList"><p class="muted">Loading…</p></div>
    </div>

</div>

<div id="layoutFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/version.js"></script>

<script src="js/supabaseClient.js"></script>

<script src="js/core/idService.js"></script>
<script src="js/core/permissionService.js"></script>
<script src="js/core/auditService.js"></script>
<script src="js/core/timelineService.js"></script>
<script src="js/core/notificationService.js"></script>
<script src="js/core/shiftService.js"></script>
<script src="js/core/evidenceService.js"></script>
<script src="js/core/bodycamService.js"></script>

<script src="js/auth.js"></script>
<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/commandPalette.js"></script>
<script src="js/bodycam-ui.js"></script>
<script src="js/bodycam.js"></script>

<script>

if(localStorage.getItem("loggedIn")!="true"){

    window.location.href="index.html";

}

document.getElementById("layoutTop").innerHTML = AppLayout.createTopbar();
document.getElementById("layoutFooter").innerHTML = AppLayout.createFooter();

</script>

</body>

</html>
