<!DOCTYPE html>
<html lang="en">

<head>

<div class="content">

        <div class="opsHead">
            <div>
                <h1><svg class="pIcon" width="24" height="24" aria-hidden="true"><use href="assets/pims-sprite.svg#pims-dispatch"></use></svg> Live Operations Center</h1>
                <p class="muted" id="opsSub">Every officer on duty, live.</p>
            </div>
            <div class="opsLive" id="opsLive"><span class="opsDot"></span> LIVE</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

if(localStorage.getItem("loggedIn")!="true"){

    window.location.href="index.html";
