<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIBA PIMS | Link Shortener</title>
<link rel="icon" type="image/svg+xml" href="assets/pims-badge.svg">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div id="layoutTop"></div>

<div class="content">

    <div class="card">

        <h1><svg class="pIcon" width="24" height="24" aria-hidden="true"><use href="assets/pims-sprite.svg#pims-attach"></use></svg> SHIBA Links</h1>

        <p>Turn long URLs into short <b>/s/</b> links, tied to your SHIBA
           account. Every link tracks its own click count.</p>

    </div>

    <div class="card">
        <h2>New short link</h2>
        <div class="shForm" id="shForm"></div>
    </div>

    <div class="card">
        <div class="shListHead">
            <h2 style="margin:0">Links</h2>
            <label class="shMineToggle"><input type="checkbox" id="shMine" checked> Only mine</label>
        </div>
        <div id="shList"><p class="muted">Loading…</p></div>
    </div>

</div>

<div id="layoutFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/version.js"></script>

<script src="js/supabaseClient.js"></script>

<script src="js/core/idService.js"></script>
<script src="js/core/permissionService.js"></script>
<script src="js/core/auditService.js"></script>
<script src="js/core/linkService.js"></script>

<script src="js/auth.js"></script>
<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/commandPalette.js"></script>
<script src="js/shortener.js"></script>

<script>

if(localStorage.getItem("loggedIn")!="true"){

    window.location.href="index.html";

}

document.getElementById("layoutTop").innerHTML = AppLayout.createTopbar();
document.getElementById("layoutFooter").innerHTML = AppLayout.createFooter();

</script>

</body>

</html>
