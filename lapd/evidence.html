<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIBA PIMS | Evidence Room</title>
    <link rel="icon" type="image/svg+xml" href="assets/pims-badge.svg">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="layoutTop"></div>

<div class="content">

    <div class="card">

        <h1><svg class="pIcon" width="24" height="24" aria-hidden="true"><use href="assets/pims-sprite.svg#pims-evidence"></use></svg> Evidence Room</h1>

        <p>The central store for every piece of digital evidence — bodycam,
           photos, audio, documents and more. Filter it any way you like;
           each item carries its full chain of custody.</p>

        <div class="evrScope" id="evrScope"></div>

    </div>

    <div class="card">

        <div class="evrStats" id="evrStats"></div>

        <div class="evrFilters" id="evrFilters"></div>

        <div id="evrResults"><p class="muted">Loading evidence…</p></div>

    </div>

</div>

<div id="layoutFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/version.js"></script>

<script src="js/core/auditService.js"></script>
<script src="js/core/notificationService.js"></script>
<script src="js/core/barcodeService.js"></script>
<script src="js/core/evidenceService.js"></script>

<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>

<script>

if(localStorage.getItem("loggedIn")!="true"){

    window.location.href="index.html";

}
